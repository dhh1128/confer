# Dependabot keeps GitHub Actions and Python deps current and surfaces
# advisories — confer holds a Discord bot token, so silent action/dep drift
# (including the node20-runtime deprecation class) is a real risk (review DEV-F2).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    # Group SHA-pin bumps so each weekly update (SHA + the trailing # vN
    # comment, updated together) arrives as a single PR (this.i shp4nqx7).
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
