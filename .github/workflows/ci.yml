name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the test job only reads the repo. Declared explicitly so it
# does not inherit a broader repo-default GITHUB_TOKEN scope (review DEV-F1).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        run: uv run pytest

  # Reject invisible / Trojan-Source Unicode (GlassWorm, bidi reordering) that
  # human review and ordinary linting cannot catch. See this.i uc7nqx4p.
  unicode-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Scan for invisible / Trojan-Source Unicode
        run: python3 scripts/check_unicode.py
