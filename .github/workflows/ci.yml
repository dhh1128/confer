name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the test job only reads the repo. Declared explicitly so it
# does not inherit a broader repo-default GITHUB_TOKEN scope (review DEV-F1).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        run: uv run pytest
