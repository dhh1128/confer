name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the test job only reads the repo. Declared explicitly so it
# does not inherit a broader repo-default GITHUB_TOKEN scope (review DEV-F1).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Run tests with branch coverage
        run: uv run pytest

  # Reject invisible / Trojan-Source Unicode (GlassWorm, bidi reordering) that
  # human review and ordinary linting cannot catch. See this.i uc7nqx4p.
  unicode-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Scan for invisible / Trojan-Source Unicode
        run: python3 scripts/check_unicode.py
