[project]
name = "confer"
version = "0.1.0"
description = "MCP-mediated agent-to-human notification system via Discord DM"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniel Hardman", email = "daniel.hardman@gmail.com" }]
keywords = ["mcp", "discord", "notifications", "agents", "claude", "daemon"]
# NOTE: no license is declared yet — pick one (e.g. add `license = "MIT"` and a
# LICENSE file) before the first PyPI publish (PyPI Trusted Publishing, pp4nqvx7).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "discord-py>=2.7.1",
    "mcp>=1.27.2",
]

[project.urls]
Homepage = "https://github.com/dhh1128/confer"
Repository = "https://github.com/dhh1128/confer"
Issues = "https://github.com/dhh1128/confer/issues"

[project.scripts]
confer = "confer.cli:main"
confer-server = "confer.server:main"
confer-daemon = "confer.daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confer"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=confer --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: live end-to-end test against a real Discord bot; gated behind CONFER_INTEGRATION=1, skipped by default, exempt from coverage (this.i gjx4m7p2).",
    "interactive: human-in-the-loop test; you act in Discord. Gated behind --interactive, skipped by default, exempt from coverage (this.i k4n7pqx2).",
]

[tool.coverage.run]
branch = true
source = ["confer"]
omit = ["tests/integration/*"]
